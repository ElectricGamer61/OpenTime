name: Report a bug
description: Something broke, looks wrong, or doesn't do what it says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A couple of sentences is plenty.
        Please don't paste window titles or anything else private from your tracked time.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: I started a focus session and the timer stopped at 12:00.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps you took, if you remember them.
      placeholder: |
        1. Open Calendar
        2. Click a block
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: OpenTime version
      description: Filled in for you when you use Feedback in the app. Otherwise it's in Settings, Updates & feedback.
      placeholder: 0.3.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images in here.
