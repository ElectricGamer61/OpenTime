name: Windows Package

on:
  push:
    branches:
      - fm/opentime-finish-packaging
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run package:win

      - name: Zip the unpacked build
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/OpenTime-win-unpacked.zip

      # Proves the installer isn't just a build artifact: silently installs it
      # on this real Windows host, launches the installed exe with an isolated
      # user-data dir, and fails the job if it exits early or never writes
      # anything to storage.
      - name: Install and launch the packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          Write-Host "Installing $($installer.Name) silently..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait

          $exePath = Join-Path $env:LOCALAPPDATA "Programs\OpenTime\OpenTime.exe"
          if (-not (Test-Path $exePath)) {
            throw "Installed exe not found at $exePath"
          }

          $userData = Join-Path $env:TEMP "opentime-verify"
          $proc = Start-Process -FilePath $exePath -ArgumentList "--user-data-dir=$userData","--disable-gpu" -PassThru
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            throw "OpenTime.exe exited early with code $($proc.ExitCode)"
          }
          Write-Host "OpenTime.exe is running (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force

          $written = Get-ChildItem -Path $userData -Recurse -ErrorAction SilentlyContinue
          if (-not $written) {
            throw "Installed app never wrote anything to its user-data dir"
          }
          Write-Host "Confirmed the installed app wrote $($written.Count) file(s)/dir(s) to its user-data dir"

      # electron-builder can only stamp build/icon.ico into the .exe's
      # resources (rcedit) on a real Windows host, and NSIS shortcut/installer
      # icon wiring can only be inspected the same way — see
      # electron-builder.cjs's canEditExecutable comment and
      # src/main/icon.ts. Checks every place a user actually sees the icon:
      # the installer, the installed exe, the uninstaller, and both
      # shortcuts, by sampling each icon's average colour against the brand
      # mark's violet fill (build/icon.svg) rather than diffing exact pixels,
      # which would be brittle across icon-extraction paths.
      - name: Verify the branded icon everywhere a user sees it
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          function Test-BrandedIcon($path, $label) {
            if (-not (Test-Path $path)) { throw "$label not found at $path" }
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($path)
            if ($null -eq $icon) { throw "$label has no associated icon" }
            $bmp = $icon.ToBitmap()
            $rSum = 0; $gSum = 0; $bSum = 0; $n = 0
            for ($x = 0; $x -lt $bmp.Width; $x += 2) {
              for ($y = 0; $y -lt $bmp.Height; $y += 2) {
                $p = $bmp.GetPixel($x, $y)
                if ($p.A -gt 32) {
                  $rSum += $p.R; $gSum += $p.G; $bSum += $p.B; $n++
                }
              }
            }
            if ($n -eq 0) { throw "$label icon is fully transparent" }
            $r = $rSum / $n; $g = $gSum / $n; $b = $bSum / $n
            Write-Host "$label average colour over $n opaque samples: R=$r G=$g B=$b"
            # build/icon.svg's fill is a violet gradient (#8a63ff -> #5b2fe0):
            # blue and red both clearly outweigh green. A default/missing
            # Electron icon (or a blank one) does not.
            if (-not ($b -gt $g + 15 -and $r -gt $g + 5)) {
              throw "$label icon does not look like the OpenTime brand mark (expected violet, got R=$r G=$g B=$b)"
            }
          }

          $installerExe = (Get-ChildItem release\*.exe | Select-Object -First 1).FullName
          Test-BrandedIcon $installerExe "Installer"

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\OpenTime"
          Test-BrandedIcon (Join-Path $installDir "OpenTime.exe") "Installed app"

          $uninstaller = Get-ChildItem (Join-Path $installDir "Uninstall*.exe") | Select-Object -First 1
          if (-not $uninstaller) { throw "No uninstaller exe found under $installDir" }
          Test-BrandedIcon $uninstaller.FullName "Uninstaller"

          function Test-ShortcutIcon($shortcutPath, $label) {
            if (-not (Test-Path $shortcutPath)) { throw "$label shortcut not found at $shortcutPath" }
            $shell = New-Object -ComObject WScript.Shell
            $lnk = $shell.CreateShortcut($shortcutPath)
            Write-Host "$label shortcut target: $($lnk.TargetPath), icon: $($lnk.IconLocation)"
            # electron-builder's NSIS shortcuts point their icon at the
            # installed exe itself rather than embedding a separate .ico, so
            # confirming the icon resolves to OpenTime.exe (already proven
            # branded above) is what "this shortcut shows the brand icon"
            # actually reduces to.
            $iconPath = ($lnk.IconLocation -split ',')[0]
            if ([string]::IsNullOrWhiteSpace($iconPath)) { $iconPath = $lnk.TargetPath }
            if ($iconPath -notlike '*OpenTime.exe') {
              throw "$label shortcut icon does not point at OpenTime.exe (got '$iconPath')"
            }
          }

          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\OpenTime.lnk"
          Test-ShortcutIcon $startMenu "Start Menu"

          $desktop = Join-Path $env:USERPROFILE "Desktop\OpenTime.lnk"
          Test-ShortcutIcon $desktop "Desktop"

          Write-Host "Branded icon confirmed on the installer, installed exe, uninstaller, and both shortcuts."

      # electron-builder's NSIS step needs a real Windows host (it needs Wine
      # everywhere else); this runner is that host. Releases are used instead
      # of actions/upload-artifact because the repo's Actions artifact quota
      # is exhausted — a GitHub Release has its own storage and is also the
      # simplest thing to link to from a PR.
      - name: Publish installer as a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="win-build-${{ github.run_number }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Windows build $tag ($(git rev-parse --short HEAD))" \
            --notes "Automated Windows packaging build from \`${{ github.ref_name }}\` @ ${{ github.sha }}. Contains the NSIS installer and a zipped unpacked build." \
            --prerelease \
            release/*.exe release/OpenTime-win-unpacked.zip
